name: product-image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify_product:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out protected product
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up CPython 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify product checksum and protected runtime
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_product.py .
          python scripts/scan_headless_release.py \
            --root runtime \
            --manifest release/protected_modules_headless.json
          resolved="$(mktemp)"
          trap 'rm -f "${resolved}"' EXIT
          docker compose \
            --env-file deploy/gate.env.example \
            -f deploy/compose.yaml config --format json > "${resolved}"
          python scripts/verify_compose_contract.py "${resolved}" \
            --rest-host-port 8443 \
            --grpc-host-port 50051
          sh -n deploy/wait-for-devices.sh deploy/validate-running.sh \
            deploy/dev/bootstrap-dev-secrets.sh

      - name: Lint repository text (no em/en dashes, no CRLF, no trailing whitespace)
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            case "$f" in *.so|*.png|*.jpg|*.webp|PRODUCT_SHA256SUMS) continue ;; esac
            if grep -nP '[\x{2013}\x{2014}]' "$f"; then echo "::error file=$f::em/en dash found"; bad=1; fi
            if grep -nP '\r$' "$f"; then echo "::error file=$f::CRLF line ending"; bad=1; fi
            if grep -nP '[ \t]+$' "$f"; then echo "::error file=$f::trailing whitespace"; bad=1; fi
          done < <(git ls-files)
          exit $bad

      - name: Unit-test plaintext transport adapters
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r tests/requirements-test.txt
          PYTHONDONTWRITEBYTECODE=1 python -B -m pytest -p no:cacheprovider -q tests
          # verify_product.py forbids cache directories in the product tree.
          if find tests runtime \( -name __pycache__ -o -name .pytest_cache \) | grep -q .; then
            echo "pytest left cache directories behind" >&2
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/gate-console/package-lock.json

      - name: Build example gate console
        shell: bash
        working-directory: examples/gate-console
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          rm -rf node_modules dist

      - name: Validate version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            expected="v${version}"
            test "${GITHUB_REF_NAME}" = "${expected}" || {
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected})" >&2
              exit 1
            }
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  ci_image:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: verify_product
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out protected product
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve CI image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rfid-portal-gate-service"
          echo "tag=${image}:ci-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build protected product image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Nextwaves RFID Portal Gate Service
            org.opencontainers.image.version=${{ needs.verify_product.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=product-amd64
          cache-to: type=gha,mode=max,scope=product-amd64

      - name: Smoke test protected image
        shell: bash
        env:
          TARGET: ${{ steps.image.outputs.tag }}
          VERSION: ${{ needs.verify_product.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/scripts/smoke_headless_image.py,target=/tmp/smoke_headless_image.py,readonly" \
            "${TARGET}" /tmp/smoke_headless_image.py "${VERSION}"
          docker run --rm --entrypoint python "${TARGET}" \
            -m gate_service.restore_database --help >/dev/null

  release_image:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: verify_product
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Check out protected product
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up CPython 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Resolve release image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rfid-portal-gate-service"
          echo "name=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image}:${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${image}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push protected product image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.title=Nextwaves RFID Portal Gate Service
            org.opencontainers.image.version=${{ needs.verify_product.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=product-amd64
          cache-to: type=gha,mode=max,scope=product-amd64

      - name: Smoke test immutable image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.verify_product.outputs.version }}
        run: |
          set -euo pipefail
          target="${IMAGE}@${DIGEST}"
          docker run --rm --entrypoint python \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/scripts/smoke_headless_image.py,target=/tmp/smoke_headless_image.py,readonly" \
            "${target}" /tmp/smoke_headless_image.py "${VERSION}"
          docker run --rm --entrypoint python "${target}" \
            -m gate_service.restore_database --help >/dev/null

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          target="${IMAGE}@${DIGEST}"
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/product-image.yml@refs/tags/${GITHUB_REF_NAME}"
          cosign sign --yes "${target}"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${target}"

      - name: Publish customer deployment release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.verify_product.outputs.version }}
        run: |
          set -euo pipefail
          bundle_name="rfid-portal-gate-service-${VERSION}-linux-amd64"
          bundle_root="${RUNNER_TEMP}/${bundle_name}"
          mkdir -p "${bundle_root}"
          cp -R deploy contracts README.md VERSION "${bundle_root}/"
          {
            printf 'release_tag=%s\n' "${GITHUB_REF_NAME}"
            printf 'version=%s\n' "${VERSION}"
            printf 'source_commit=%s\n' "${GITHUB_SHA}"
            printf 'image=%s@%s\n' "${IMAGE}" "${DIGEST}"
            printf 'platform=linux/amd64\npython_abi=cp311\n'
            printf 'cosign_identity=%s/%s/.github/workflows/product-image.yml@refs/tags/%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
            printf 'cosign_oidc_issuer=https://token.actions.githubusercontent.com\n'
          } > "${bundle_root}/RELEASE_MANIFEST.txt"
          python - "${bundle_root}/VERIFY_RELEASE.md" <<'PY'
          from pathlib import Path
          import os
          import sys

          identity = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              "/.github/workflows/product-image.yml"
              f"@refs/tags/{os.environ['GITHUB_REF_NAME']}"
          )
          image = f"{os.environ['IMAGE']}@{os.environ['DIGEST']}"
          Path(sys.argv[1]).write_text(
              "# Verify this release\n\n"
              "Run `sha256sum -c SHA256SUMS` from the extracted bundle root, "
              "then verify the signed image:\n\n"
              "```sh\n"
              "cosign verify \\\n"
              f"  --certificate-identity \\\n    \"{identity}\" \\\n"
              "  --certificate-oidc-issuer \\\n"
              "    \"https://token.actions.githubusercontent.com\" \\\n"
              f"  \"{image}\"\n"
              "```\n",
              encoding="utf-8",
          )
          PY
          (
            cd "${bundle_root}"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 sha256sum > SHA256SUMS
          )
          archive="${GITHUB_WORKSPACE}/${bundle_name}.tar.gz"
          tar -C "${RUNNER_TEMP}" -czf "${archive}" "${bundle_name}"
          (
            cd "${GITHUB_WORKSPACE}"
            sha256sum "${bundle_name}.tar.gz" > "${bundle_name}.tar.gz.sha256"
          )
          flags=()
          case "${VERSION}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            "${archive}" "${archive}.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Nextwaves RFID Portal Gate Service ${VERSION}" \
            --notes "Container: ${IMAGE}@${DIGEST}" \
            "${flags[@]}"
