# Development-only Mosquitto configuration (MQTT 5 over TLS, password auth).
# Certificates and the password file are generated by bootstrap-dev-secrets.sh.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwd

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# dev only: verbose broker log for subscribe/publish tracing
log_type all
